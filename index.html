<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Български субтитри на живо</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --secondary-bg: #1e293b;
            --border-color: #334155;
        }

        /* Теми */
        body.theme-dark { --bg-color: #000000; --text-color: #ffffff; --secondary-bg: #111111; --border-color: #222211; }
        body.theme-cinema { --bg-color: #0f172a; --text-color: #facc15; --secondary-bg: #1e293b; --border-color: #334155; }
        body.theme-matrix { --bg-color: #022c22; --text-color: #4ade80; --secondary-bg: #064e3b; --border-color: #065f46; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        button, select {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.active { background-color: #ef4444; color: white; }

        select {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            padding-top: 35vh; /* Започва малко над/около средата на екрана */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #transcript-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #current-text {
            font-size: var(--font-size, 2.5rem);
            line-height: 1.4;
            font-weight: 600;
            word-break: break-word;
        }

        .status-bar {
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            background-color: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            z-index: 10;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
            margin-right: 0.4rem;
        }

        .status-indicator.listening {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body class="theme-cinema">

    <header>
        <div style="font-weight: 700; font-size: 1rem;">БГ Субтитри</div>
        <div class="controls">
            <select onchange="updateFontSize(this.value)">
                <option value="2rem">Нормален</option>
                <option value="2.5rem" selected>Голям</option>
                <option value="3rem">Много голям</option>
                <option value="3.5rem">Гигантски</option>
            </select>
            <select onchange="setTheme(this.value)">
                <option value="theme-cinema">Кино (Жълто)</option>
                <option value="theme-dark">Чисто черно</option>
                <option value="theme-matrix">Матрица (Зелено)</option>
            </select>
            <button onclick="toggleFullscreen()">Цял екран</button>
            <button id="toggle-btn" onclick="toggleRecognition()">Старт</button>
        </div>
    </header>

    <main id="main-scroll">
        <div id="transcript-container">
            <div id="current-text">Натиснете „Старт“, за да започнете...</div>
        </div>
    </main>

    <div class="status-bar">
        <div><span class="status-indicator" id="status-dot"></span> <span id="status-text">В готовност</span></div>
        <div>Web Speech API</div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;
        let wakeLock = null;

        const toggleBtn = document.getElementById('toggle-btn');
        const currentTextElem = document.getElementById('current-text');
        const mainScroll = document.getElementById('main-scroll');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        if (!SpeechRecognition) {
            alert('Грешка: Вашият браузър не поддържа гласово разпознаване.');
            toggleBtn.disabled = true;
            statusText.textContent = ' API не се поддържа';
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'bg-BG';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                toggleBtn.textContent = 'Спри';
                toggleBtn.classList.add('active');
                statusDot.classList.add('listening');
                statusText.textContent = 'Слушане...';
                requestWakeLock();
            };

            recognition.onresult = (event) => {
                let currentTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript;
                }

                currentTextElem.textContent = currentTranscript.trim() || 'Слушам реч на български...';
                mainScroll.scrollTop = mainScroll.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Грешка:', event.error);
                statusText.textContent = 'Грешка: ' + event.error;
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch (e) { console.error(e); }
                } else {
                    stopUIState();
                }
            };
        }

        function toggleRecognition() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
                stopUIState();
            } else {
                currentTextElem.textContent = 'Слушам реч на български...';
                try { recognition.start(); } catch (e) { console.error(e); }
            }
        }

        function stopUIStyle() {
            // поддържаща функция
        }

        function stopUIState() {
            isListening = false;
            toggleBtn.textContent = 'Старт';
            toggleBtn.classList.remove('active');
            statusDot.classList.remove('listening');
            statusText.textContent = 'Спряно';
            releaseWakeLock();
        }

        function updateFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size);
        }

        function setTheme(themeClass) {
            document.body.className = themeClass;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Грешка при цял екран: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
